[project]
name = "ray-serve-linear-scaffold"
version = "0.1.0"
description = "Minimal Ray Serve linear model scaffold with startup training and inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ray[serve]>=2.20.0",
  "scikit-learn>=1.4.0",
  "numpy>=1.26.0",
  "pydantic>=2.7.0",
  "joblib>=1.3.0",
  "fastapi>=0.115.0",
]

[project.scripts]
serve-linear = "app.main:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
